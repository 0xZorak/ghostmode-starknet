[package]
name = "ghostmode_receipt_gate"
version = "0.1.0"
edition = "2024_07"

[dependencies]
starknet = "2.20.0"

[dev-dependencies]
snforge_std = "0.63.0"
assert_macros = "2.20.0"

[[target.starknet-contract]]
sierra = true
casm = true

[scripts]
test = "UNIVERSAL_SIERRA_COMPILER=../.tools/bin/universal-sierra-compiler ../.tools/bin/snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
